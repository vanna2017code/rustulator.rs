    <!-- Calculator page metadata and base styles. -->
    <title>Rustulator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <style>
      body {
        min-height: 100vh;
        padding: 48px 20px;
        background: #f1f5f9;
        color: #0f172a;
        font-family: "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
        font-weight: 300;
      }

      main {
        max-width: 440px;
        margin: 0 auto;
        padding: 32px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(10, 15, 28, 0);
      }

      h1 {
        margin-bottom: 8px;
        font-size: 2rem;
      }

      main > p {
        margin-bottom: 24px;
        color: #475569;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        margin-top: 8px;
        font-weight: 300;
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        color: #0f172a;
      }

      button {
        min-height: 44px;
        margin-top: 12px;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 300;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>

    <meta property="twitter:card" content="summary_large_image" />
    <style data-tag="reset-style-sheet">
      html { line-height: 1.15; }
      body { margin: 0; }
      * {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        -webkit-font-smoothing: antialiased;
      }
      p, li, ul, pre, div, h1, h2, h3, h4, h5, h6, figure, blockquote, figcaption {
        margin: 0;
        padding: 0;
      }
      button { background-color: transparent; }
      button, input, optgroup, select, textarea {
        font-family: inherit;
        font-size: 100%;
        line-height: 1.15;
        margin: 0;
      }
      button, select { text-transform: none; }
      button, [type="button"], [type="reset"], [type="submit"] {
        -webkit-appearance: button;
        appearance: button;
        color: inherit;
      }
      button::-moz-focus-inner, [type="button"]::-moz-focus-inner, [type="reset"]::-moz-focus-inner, [type="submit"]::-moz-focus-inner {
        border-style: none;
        padding: 0;
      }
      button:-moz-focus, [type="button"]:-moz-focus, [type="reset"]:-moz-focus, [type="submit"]:-moz-focus {
        outline: 1px dotted ButtonText;
      }
      a { color: inherit; text-decoration: inherit; }
      pre { white-space: normal; }
      input { padding: 2px 4px; }
      img { display: block; }
      details { display: block; margin: 0; padding: 0; }
      summary::-webkit-details-marker { display: none; }
      [data-thq="accordion"] [data-thq="accordion-content"] {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-in-out;
        padding: 0;
      }
      [data-thq="accordion"] details[data-thq="accordion-trigger"][open] + [data-thq="accordion-content"] {
        max-height: 1000vh;
      }
      details[data-thq="accordion-trigger"][open] summary [data-thq="accordion-icon"] {
        transform: rotate(180deg);
      }
      html { scroll-behavior: smooth; }
    </style>
    <!-- Base typography and theme styles. -->
    <style data-tag="default-style-sheet">

      body {
        font-family: "Bahnschrift", sans-serif;

        text-decoration: none;

        color: var(--dl-color-theme-neutral-dark);

      [class*="-thq-product-item-wrapper-elm"] > a { display: contents; }

    <style>
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible,
      [role="button"]:focus-visible,
      [role="link"]:focus-visible,
      [role="radio"]:focus-visible,
      [role="checkbox"]:focus-visible,
      [role="tab"]:focus-visible,
      [role="menuitem"]:focus-visible {
        outline: 2px solid var(--color-primary, #2563eb);
        outline-offset: 2px;
      }
      [role="radio"]:focus-visible {
        outline-offset: 0;
      }
      [tabindex="-1"]:focus-visible {
        outline: none;
      }
      .tq-skip-link {
        position: fixed;
        top: -100px;
        left: 8px;
        z-index: 100000;
        padding: 10px 16px;
        border-radius: 0 0 6px 6px;
        background: var(--color-primary, #2563eb);
        color: var(--color-on-primary, #ffffff);
        font: 300 14px/1.2 "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
        text-decoration: none;
        transition: top 0.15s ease;
      }
      .tq-skip-link:focus {
        top: 0;
      }
    </style>
    <style>
      body {
        --calculator-type-size: clamp(2rem, 10vw, 3rem);
        position: relative;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100vh;
        padding: 0;
        background: #e2e8f0;
        color: #0f172a;
      }

      .page-header {
        grid-column: 1 / -1;
        position: relative;
        min-height: 92px;
        padding: 26px 32px;
      }

      .sidebar {
        display: flex;
        grid-column: 1;
        grid-row: 2;
        min-height: calc(100vh - 92px);
        flex-direction: column;
        padding: 30px 22px;
        background: #0f172a;
        color: #f8fafc;
        font-family: "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
      }

      .sidebar-nav {
        display: grid;
        gap: 8px;
      }

      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-left: 2px solid #60a5fa;
        background: #1e293b;
        color: #f8fafc;
        font-size: 0.95rem;
      }

      .sidebar-link .calculator-icon {
        width: 24px;
        height: 24px;
        flex: none;
      }

      .sidebar-link .normal-icon {
        width: 16px;
        height: 16px;
        flex: none;
      }

      .sidebar-link .flask-icon {
        width: 18px;
        height: 18px;
        flex: none;
      }

      .sidebar-note {
        margin-top: 38px;
        color: #cbd5e1;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .sidebar-dropdown {
        max-width: 100%;
      }

      .sidebar-dropdown summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #f8fafc;
        cursor: pointer;
        list-style: none;
      }

      .sidebar-dropdown summary::-webkit-details-marker {
        display: none;
      }

      .sidebar-dropdown summary::after {
        content: "+";
        color: #94a3b8;
      }

      .sidebar-dropdown[open] summary::after {
        content: "−";
      }

      .sidebar-dropdown-content {
        margin-top: 10px;
        padding: 10px 12px;
        border-left: 1px solid #475569;
        color: #cbd5e1;
        font-size: 0.8rem;
      }

      .sidebar-dropdown-content a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #bfdbfe;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .github-icon {
        width: 15px;
        height: 15px;
        flex: none;
        fill: currentColor;
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 24px;
        color: #94a3b8;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
      }

      #app {
        grid-column: 2;
        grid-row: 2;
        width: 100%;
        min-width: 0;
        min-height: calc(100vh - 92px);
        margin: 0;
        padding: 32px;
        display: grid;
        place-items: center;
      }

      #app,
      #app * {
        font-family: "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
        font-weight: 300;
      }

      .page-title {
        max-width: calc(100% - 48px);
        color: #0f172a;
        font-family: "Bahnschrift", sans-serif;
        font-size: var(--calculator-type-size);
        font-stretch: semi-condensed;
        font-weight: 300;
        text-align: left;
      }

      .version-string {
        position: absolute;
        top: 36px;
        right: 32px;
        color: #475569;
        font-size: 0.72rem;
        text-align: right;
        white-space: nowrap;
      }

      main.calculator {
        width: min(100%, clamp(300px, 42vw, 520px));
        max-width: 520px;
        padding: 0;
        color: #0f172a;
        scroll-margin-top: 24px;
        container-type: inline-size;
      }

      .calculator-display {
        position: relative;
        display: flex;
        min-height: clamp(112px, 30cqw, 160px);
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        margin-bottom: 12px;
        padding: clamp(16px, 4.2cqw, 24px);
        border: 1px solid #e2e8f0;
        border-radius: 0;
        background: #e2e8f0;
        text-align: right;
      }

      .calculator-operation {
        position: absolute;
        top: 14px;
        left: 14px;
        display: grid;
        width: 1.8em;
        height: 1.8em;
        place-items: center;
        border: 1px solid #cbd5e1;
        border-radius: 0;
        background: #e2e8f0;
        color: #0f172a;
        font-size: calc(clamp(2rem, 10vw, 3rem) / 5);
      }

      .calculator-operation[hidden] {
        display: none;
      }

      .calculator-sign-toggle {
        position: absolute;
        top: 14px;
        right: 14px;
        min-width: 1.8em;
        min-height: 1.8em;
        padding: 0 0.25em;
        border: 1px solid #cbd5e1;
        border-radius: 0;
        background: #e2e8f0;
        color: #0f172a;
        font-size: 0.875rem;
      }

      .calculator-result {
        display: block;
        overflow: hidden;
        color: #0f172a;
        font-size: clamp(2rem, 13cqw, 3.5rem);
        font-family: "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: transparent;
      }

      .calculator-keys {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(8px, 2.6cqw, 14px);
      }

      .calculator-keys button {
        min-height: clamp(54px, 15.25cqw, 76px);
        margin: 0;
        border: 1px solid transparent;
        border-radius: 0;
        background: #e2e8f0;
        color: #0f172a;
        font-size: clamp(1.1rem, 5cqw, 1.5rem);
        font-weight: 300;
        transition: background 120ms ease, transform 120ms ease;
      }

      .calculator-keys [data-digit] {
        font-family: "Bahnschrift", sans-serif;
        font-stretch: semi-condensed;
        font-weight: 300;
      }

      .calculator-keys button:hover {
        background: #e2e8f0;
      }

      .calculator-keys button:active {
        transform: scale(0.96);
      }

      .calculator-keys .operator-key {
        border-color: transparent;
        background: #e2e8f0;
      }

      .calculator-keys .operator-key:hover {
        background: #cbd5e1;
      }

      .calculator-keys .utility-key {
        color: #0f172a;
      }

      .calculator-keys .equals-key {
        grid-column: 1 / -1;
        border-radius: 0;
        border-color: transparent;
        background: #e2e8f0;
      }

      .calculator-keys .equals-key:hover {
        background: #cbd5e1;
      }

      .calculator-status {
        width: 100%;
        margin-top: 4px;
        color: #0f172a;
        font-size: 0.875rem;
        text-align: center;
      }

      .calculator-status:empty {
        display: none;
      }

      @media (max-width: 420px) {
        main.calculator {
          padding: 0;
        }

        .calculator-keys {
          gap: 8px;
        }

        .calculator-keys button {
          min-height: 54px;
        }
      }

      @media (max-width: 700px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(0, 1fr);
        }

        .page-header {
          grid-column: 1;
          grid-row: 1;
          min-height: 92px;
          padding: 18px 20px;
        }

        .sidebar {
          grid-column: 1;
          grid-row: 2;
          min-height: 0;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 14px 18px;
        }

        .sidebar-nav {
          margin-left: auto;
        }

        .sidebar-link {
          padding: 9px 12px;
        }

        .sidebar-footer {
          display: none;
        }

        .sidebar-note {
          margin-top: 0;
          font-size: 0.8rem;
        }

        #app {
          grid-column: 1;
          grid-row: 3;
          min-height: calc(100vh - 150px);
          padding: 32px 20px;
        }

        .page-title {
          font-size: 1.8rem;
        }

        .version-string {
          top: 58px;
          right: 20px;
          font-size: 0.65rem;
        }
      }
    </style>

          <button class="calculator-sign-toggle" id="sign-toggle" type="button" aria-label="Toggle sign">+/−</button>
          <output class="calculator-result" id="display" aria-live="polite">0</output>
          <p class="calculator-status" id="status" role="status" aria-live="polite"></p>
        </div>
        <div class="calculator-keys" id="calculator-keys">
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button class="operator-key" type="button" data-operation="divide" aria-label="Divide">÷</button>

          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button class="operator-key" type="button" data-operation="multiply" aria-label="Multiply">×</button>

          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button class="operator-key" type="button" data-operation="subtract" aria-label="Subtract">−</button>

          <button class="utility-key" type="button" data-action="clear" aria-label="Clear">AC</button>
          <button type="button" data-digit="0">0</button>
          <button class="utility-key" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="operator-key" type="button" data-operation="add" aria-label="Add">+</button>

          <button class="equals-key" type="button" data-action="equals">=</button>
        </div>
      </main>
    </div>
    <!-- Calculator interactions and backend requests. -->
    <script>
      (function () {
        var display = document.getElementById('display');
        var operationIndicator = document.getElementById('operation-indicator');
        var signToggle = document.getElementById('sign-toggle');
        var status = document.getElementById('status');
        var keys = document.getElementById('calculator-keys');
        var storedValue = null;
        var pendingOperation = null;
        var waitingForOperand = false;
        var operationLabels = {
          add: '+',
          subtract: '−',
          multiply: '×',
          divide: '÷'
        };
        var operationNames = {
          add: 'Addition',
          subtract: 'Subtraction',
          multiply: 'Multiplication',
          divide: 'Division'
        };

        function formatError(error) {
          var message = error && error.message ? error.message : '';
          if (/i\d+|u\d+|integer|parse|range/i.test(message)) return 'number err';
          if (/unknown operation|invalid operation/i.test(message)) return 'invalid opr';
          return message || 'Calculation failed';
        }

        function isValidI128(value) {
          var negative = value.charAt(0) === '-';
          var digits = (negative ? value.slice(1) : value).replace(/^0+(?=\d)/, '');
          var limit = negative
            ? '170141183460469231731687303715884105728'
            : '170141183460469231731687303715884105727';
          return digits.length < limit.length ||
            (digits.length === limit.length && digits <= limit);
        }

        function enterDigit(digit) {
          if (waitingForOperand || display.textContent === '0' || display.textContent === 'Error') {
            display.textContent = digit;
            waitingForOperand = false;
          } else if (display.textContent === '-0') {
            display.textContent = '-' + digit;
          } else if (display.textContent.replace('-', '').length < 39) {
            display.textContent += digit;
          }
          status.textContent = '';
        }

        function toggleSign() {
          if (display.textContent === 'Error') return;
          if (waitingForOperand) {
            display.textContent = '0';
            waitingForOperand = false;
          }
          display.textContent = display.textContent.charAt(0) === '-'
            ? display.textContent.slice(1)
            : '-' + display.textContent;
          status.textContent = '';
        }

        function clearCalculator() {
          display.textContent = '0';
          status.textContent = '';
          operationIndicator.textContent = '';
          operationIndicator.removeAttribute('aria-label');
          operationIndicator.hidden = true;
          storedValue = null;
          pendingOperation = null;
          waitingForOperand = false;
        }

        function backspace() {
          if (waitingForOperand || display.textContent === 'Error') return;
          display.textContent = display.textContent.charAt(0) === '-' && display.textContent.length <= 2
            ? '0'
            : display.textContent.length > 1
            ? display.textContent.slice(0, -1)
            : '0';
        }

        function selectOperation(operation) {
          if (display.textContent === 'Error') clearCalculator();
          storedValue = display.textContent;
          pendingOperation = operation;
          waitingForOperand = true;
          operationIndicator.textContent = operationLabels[operation];
          operationIndicator.setAttribute('aria-label', operationNames[operation]);
          operationIndicator.hidden = false;
          status.textContent = '';
        }

        async function calculate() {
          if (storedValue === null || pendingOperation === null || waitingForOperand) return;

          var left = storedValue;
          var right = display.textContent;
          var operation = pendingOperation;
          operationIndicator.textContent = '=';
          operationIndicator.setAttribute('aria-label', 'Equals');
          status.textContent = '';
          if (!isValidI128(left) || !isValidI128(right)) {
            status.textContent = 'number err';
            waitingForOperand = false;
            return;
          }
          waitingForOperand = true;

          try {
            var response;
            try {
              response = await fetch('/' + operation + '/' + encodeURIComponent(left) + '/' + encodeURIComponent(right));
            } catch (_error) {
              status.textContent = 'Backend not found';
              waitingForOperand = false;
              return;
            }
            var result = await response.text();
            if (response.status === 404) throw new Error('Backend not found');
            if (!response.ok) throw new Error(result || 'The calculation failed.');
            display.textContent = result;
            storedValue = null;
            pendingOperation = null;
          } catch (error) {
            status.textContent = formatError(error);
            waitingForOperand = false;
          }
        }

        keys.addEventListener('click', function (event) {
          var button = event.target.closest('button');
          if (!button) return;
          if (button.dataset.digit !== undefined) {
            enterDigit(button.dataset.digit);
          } else if (button.dataset.operation) {
            selectOperation(button.dataset.operation);
          } else if (button.dataset.action === 'clear') {
            clearCalculator();
          } else if (button.dataset.action === 'backspace') {
            backspace();
          } else if (button.dataset.action === 'equals') {
            calculate();
          }
        });

        signToggle.addEventListener('click', toggleSign);

        document.addEventListener('keydown', function (event) {
          if (/^[0-9]$/.test(event.key)) {
            enterDigit(event.key);
          } else if (event.key === '-' && waitingForOperand) {
            event.preventDefault();
            toggleSign();
          } else if (event.key === '+' || event.key === '-' || event.key === '*' || event.key === '/') {
            event.preventDefault();
            selectOperation({ '+': 'add', '-': 'subtract', '*': 'multiply', '/': 'divide' }[event.key]);
          } else if (event.key === 'Enter' || event.key === '=') {
            event.preventDefault();
            calculate();
          } else if (event.key === 'Backspace') {
            backspace();
          } else if (event.key === 'Escape') {
            clearCalculator();
          }
        });
      })();
    </script>
    <!-- Initialize and maintain generated Swiper sliders. -->
    <script>
      (function () {
        var PROBE_ATTR = 'data-teleport-slider-probe';
        var PROBE_MAX_LIFETIME_MS = 30000;
        var SwiperCtor = null;
        var capturedModules = null;
        var probeEl = null;
        var trackedInstances = [];
        function safeJsonParse(raw) {
          if (!raw) return null;
          var decoder = document.createElement('textarea');
          decoder.innerHTML = raw;
          try { return JSON.parse(decoder.value); } catch (e) { return null; }
        }
        function toPositiveInt(v, fallback) {
          var n = parseInt(v, 10);
          return (!isNaN(n) && n > 0) ? n : fallback;
        }
        function toSpacing(v, fallback) {
          // Zero is a legitimate gap, so it must not fall through to the default
          // the way toPositiveInt makes it.
          var n = parseInt(v, 10);
          return (!isNaN(n) && n >= 0) ? n : fallback;
        }
        function buildBreakpoints(el) {
          var raw = safeJsonParse(el.getAttribute('data-breakpoints')) || {};
          var mobile = raw.mobile || {};
          var tablet = raw.tablet || {};
          var desktop = raw.desktop || {};

          // slider's OWN base config instead of assuming a multi-card carousel.
          // Hardcoding 3-on-desktop here overrode every single-slide slider that
          // omits the map — the generator tells the model to omit it for hero
          // carousels, and the gallery lightbox omitted it too — which fits every
          // slide onto one page and leaves the arrows and bullets with nowhere to
          // go. Same derivation the editor uses in flows/slider.ts.
          var baseSlidesPerView = toPositiveInt(el.getAttribute('data-slides-per-view'), 1);
          var bps = {};
          bps[0] = {
            slidesPerView: toPositiveInt(mobile.slidesPerView, 1),
            spaceBetween: toSpacing(mobile.spaceBetween, 12),
          };
          bps[768] = {
            slidesPerView: toPositiveInt(tablet.slidesPerView, Math.min(baseSlidesPerView, 2)),
            spaceBetween: toSpacing(tablet.spaceBetween, 16),
          };
          bps[1024] = {
            slidesPerView: toPositiveInt(desktop.slidesPerView, baseSlidesPerView),
            spaceBetween: toSpacing(desktop.spaceBetween, 24),
          };
          return bps;
        }
        function buildConfig(el) {
          var cfg = {
            slidesPerView: toPositiveInt(el.getAttribute('data-slides-per-view'), 1),
            spaceBetween: toPositiveInt(el.getAttribute('data-space-between'), 0),
            breakpoints: buildBreakpoints(el),
          };

          // initially (Navigation / Pagination / Autoplay). Without these
          // the re-instantiated Swiper only has Resize + Observer — the
          // navigation arrows and pagination bullets become dead.
          if (capturedModules && capturedModules.length > 0) {
            cfg.modules = capturedModules.slice();
          }
          if (el.getAttribute('data-pagination') === 'true') {
            var paginationEl = el.querySelector('.swiper-pagination');
            if (paginationEl) cfg.pagination = { el: paginationEl, clickable: true, type: 'bullets' };

        // Capture the Swiper constructor and modules from an existing instance.
        function captureFromInstance(instance) {
          if (!instance) return;

          if (!capturedModules && instance.params && Array.isArray(instance.params.modules)) {

            // does not surprise us on a subsequent re-instantiation.
            capturedModules = instance.params.modules.slice();

        function createCtorProbe() {
          // Create a temporary slider so the CDN bundle initializes Swiper and
          // exposes its constructor and modules for later re-instantiation.
          // This script is inline in <body>, so it runs while the document is
          // still parsing — before the deferred CDN bundle executes. The probe
          // is therefore guaranteed to be present for the bundle's one and only
          // init pass. It is appended after the app root so real sliders are
          // initialized before the probe.
          var host = document.body || document.documentElement;
          if (!host) return;

            var el = document.createElement('div');
            el.setAttribute('data-thq', 'slider');
            el.setAttribute(PROBE_ATTR, 'true');
            el.setAttribute('aria-hidden', 'true');

            setTimeout(disposeProbe, PROBE_MAX_LIFETIME_MS);

        function disposeProbe() {
          if (!probeEl) return;
          var el = probeEl;
          probeEl = null;
          try { if (el.swiper && !el.swiper.destroyed) el.swiper.destroy(true, false); } catch (_e) { /* best-effort */ }
          try { if (el.parentNode) el.parentNode.removeChild(el); } catch (_e) { /* best-effort */ }
        }
        function captureCtorFromProbe() {
          if (!probeEl) return;
          if (probeEl.swiper) {
            captureFromInstance(probeEl.swiper);
          }
          if (SwiperCtor) {
            disposeProbe();
          }

        function trackInstance(instance) {
          instance.__teleportPatched = true;
          trackedInstances.push(instance);
          return instance;
        }
        function reapDetachedInstances() {
          // React unmounts a slider that lives inside a conditionally rendered
          // subtree — the product gallery lightbox — every time it closes. That
          // leaves our instance bound to a detached element with its window
          // resize handler and ResizeObserver still live, and every reopen adds
          // another one. Only DETACHED elements are reaped: destroy() nulls the
          // element's swiper reference, which would sabotage a live element whose
          // instance had since been replaced by someone else.
          if (trackedInstances.length === 0) return;
          var kept = [];
          for (var i = 0; i < trackedInstances.length; i++) {
            var instance = trackedInstances[i];
            var el = instance && instance.el;
            if (!el) continue;
            if (document.contains(el)) {
              kept.push(instance);
              continue;
            }
            try { if (!instance.destroyed) instance.destroy(true, false); } catch (_e) { /* best-effort */ }
          }
          trackedInstances = kept;
        }
        function collectSliders() {
          var all = document.querySelectorAll('[data-thq="slider"]');
          var sliders = [];
          for (var i = 0; i < all.length; i++) {
            if (all[i].hasAttribute(PROBE_ATTR)) continue;
            sliders.push(all[i]);
          }
          return sliders;
        }
        function rebuildPaginationDom(instance) {
          // Pagination bullets can be re-appended after our construction by
          // the CDN bundle's scheduled post-init render or by React
          // reconciliation during SPA back-nav. We re-query the pagination
          // container from the live instance (rather than a captured
          // reference) because React may have replaced the container DOM
          // node during a re-mount.
          try {
            if (instance.destroyed) return;
            var pagEl = instance.pagination && instance.pagination.el;
            if (pagEl) pagEl.innerHTML = '';
            if (instance.pagination && typeof instance.pagination.render === 'function') {
              instance.pagination.render();
            }
            if (instance.pagination && typeof instance.pagination.update === 'function') {
              instance.pagination.update();
            }
          } catch (_e) { /* best-effort */ }
        }
        function replaceWithFreshInstance(el) {
          // Destroy the CDN-constructed Swiper and rebuild it with the
          // proper config up front. Patching in place (setBreakpoint +
          // update) leaves pagination stuck at the original bullet count
          // (5 for 5 slides at the default slidesPerView=1), Swiper's
          // external pagination.render() APPENDS instead of rebuilding,
          // and there is no other public API to force a clean rebuild of
          // the pagination subsystem. A fresh construction with the right
          // breakpoints, pagination el, and navigation els gives us the
          // correct page count (ceil(slides / slidesPerView)) and the
          // first bullet correctly marked active.
          try {
            var pagEl = el.querySelector('.swiper-pagination');
            try { el.swiper.destroy(true, true); } catch (_destroyErr) { /* best-effort */ }

            // our new render() does not append to them.
            if (pagEl) pagEl.innerHTML = '';
            if (!SwiperCtor) return false;
            var instance = trackInstance(new SwiperCtor(el, buildConfig(el)));

            // fires even after our destroy-and-recreate, re-appending
            // bullets into the container. React can also restore stale
            // bullet nodes from the prior page visit during SPA back-nav
            // reconciliation. Rebuild at several timings so any late
            // injection is mopped up.
            setTimeout(function () { rebuildPaginationDom(instance); }, 100);
            setTimeout(function () { rebuildPaginationDom(instance); }, 400);
            setTimeout(function () { rebuildPaginationDom(instance); }, 1000);

          } catch (_err) {
            return false;
          }

        function ensureSwiper(el) {
          if (!el) return false;
          if (el.swiper && el.swiper.__teleportPatched) return true;

          // the DOM, which re-fires the outer MutationObserver synchronously
          // and would otherwise loop back into this function against a

          if (isWorking) return false;

            if (el.swiper) {

              // next mount.
              if (el.swiper.destroyed) return false;
              captureFromInstance(el.swiper);
              // Rebuild the instance from scratch with the correct config:
              // the CDN's default config ignores our breakpoints and the
              // pagination bullet count is locked to the original slide
              // count. A destroy + re-create is the only way to get the
              // right page-count pagination plus a correctly marked first
              // active bullet.
              return replaceWithFreshInstance(el);

            // No .swiper attached — either the CDN bundle hasn't fired yet
            // (poll will retry), or the element was freshly re-mounted by
            // Next.js SPA back/forward nav, or a modal just revealed a slider
            // the bundle never saw. The bundle only inits on the initial
            // DOMContentLoaded (plus a URL change), so it won't re-init any of
            // those. Construct our own instance with the captured ctor + modules.
            if (!SwiperCtor) return false;

              // re-mount so the fresh Swiper's render() doesn't append to
              // leftover bullets/arrows from the previous page visit.
              var stalePagination = el.querySelector('.swiper-pagination');
              if (stalePagination) stalePagination.innerHTML = '';
              trackInstance(new SwiperCtor(el, buildConfig(el)));
              return true;

            }
          } finally {
            isWorking = false;
          }
        }

          // (initial load, pageshow, or DOM mutation), reconcile the

          var all = collectSliders();

            var el = all[i];
            if (!el.swiper || !el.swiper.__teleportPatched) continue;
            if (el.swiper.destroyed) continue;

            if (!pagEl) continue;
            var domCount = pagEl.querySelectorAll('.swiper-pagination-bullet').length;

        function ensureAll() {
          captureCtorFromProbe();
          reapDetachedInstances();
          var all = collectSliders();
          var allDone = all.length > 0;
          for (var i = 0; i < all.length; i++) {
            if (!ensureSwiper(all[i])) allDone = false;
          }
          normalisePaginationCount();
          return allDone;

          if (pollTimer) return;
          var tries = 0;

            tries += 1;
            if (ensureAll() || tries >= 80) {

        function scheduleInitialTrigger() {

        // the slider element without an attached .swiper instance) triggers
        // re-instantiation via the captured ctor. Don't invoke the patch
        // synchronously on each mutation — the CDN bundle's own Swiper
        // construction fires many mutations and we'd otherwise patch a
        // half-initialised instance. Debounce through a macrotask so the
        // current sync mutation chain finishes first.
        var mutationPending = false;

          var observer = new MutationObserver(function () {
            if (mutationPending) return;
            mutationPending = true;
            setTimeout(function () { mutationPending = false; trigger(); }, 150);
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        } catch (_e) { /* MutationObserver unsupported — polling still covers initial load */ }
      })();
    </script>
